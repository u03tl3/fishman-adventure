<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#06283f"><title>Fishman v22 – Aquarium Art Prototype</title>
<style>
:root{--ink:#eaffff;--teal:#86f7e7;--navy:#061827;--sun:#ffe177;--pink:#ff799e;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04182b;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffe481;outline-offset:3px}
#app{width:100vw;height:100dvh;display:grid;grid-template-columns:clamp(82px,13vw,158px) minmax(0,1fr) clamp(110px,17vw,204px);padding:calc(env(safe-area-inset-top,0px) + 4px) calc(env(safe-area-inset-right,0px) + 5px) calc(env(safe-area-inset-bottom,0px) + 4px) calc(env(safe-area-inset-left,0px) + 5px);gap:5px;align-items:center;background:radial-gradient(circle at 50% 35%,#135479,#031525 88%)}
.viewport{position:relative;min-width:0;min-height:0;width:100%;height:100%;max-height:100%;border:2px solid #5ec9dd;border-radius:13px;background:#043958;overflow:hidden;box-shadow:inset 0 0 0 3px #16425d,0 0 40px #00a6d51e}
canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none}
.side{height:100%;min-width:0;display:flex;flex-direction:column;gap:clamp(6px,2vh,16px);align-items:center;justify-content:center}
.stick{border:4px solid #4e91b3;border-radius:50%;width:clamp(72px,10.7vw,138px);height:clamp(72px,10.7vw,138px);max-width:100%;position:relative;background:radial-gradient(circle at 40% 40%,#385e75,#0a233c 68%);box-shadow:inset 0 0 0 8px #0c3450,0 6px 18px #0009;touch-action:none;user-select:none}
.stick.active{border-color:#e2fbff}.knob{position:absolute;top:50%;left:50%;width:53%;height:53%;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #124b6f;background:radial-gradient(circle at 32% 24%,#9bfcfa,#35a6ce 52%,#175674);box-shadow:inset -4px -7px 6px #102c53,0 5px 8px #0008;pointer-events:none}
.stick::before{content:'✣';position:absolute;inset:0;display:grid;place-items:center;color:#a3ddea62;font-size:22px}.hint{font-size:clamp(8px,1.15vw,12px);font-weight:800;letter-spacing:.09em;color:#a7d5e5;text-align:center}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(4px,.5vw,10px)}.round{width:clamp(40px,5.5vw,70px);height:clamp(40px,5.5vw,70px);border-radius:50%;background:linear-gradient(140deg,#ffdc80,#b96733);border:3px solid #5e4b36;box-shadow:0 4px 0 #311d23;color:#171b2d;font-weight:1000;font-size:clamp(12px,2vw,22px)}.round.secondary{background:linear-gradient(145deg,#9deffc,#247fa3);border-color:#285269}.round.purple{background:linear-gradient(145deg,#e1adff,#9363db);border-color:#685394}.round:active{transform:translateY(3px);box-shadow:0 1px 0 #161329}
.top{position:absolute;top:7px;left:9px;right:9px;z-index:2;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}.pill{padding:5px 9px;border-radius:999px;background:#05253cde;border:1px solid #72cddc90;color:#d5fbff;font-size:clamp(9px,1.05vw,13px);font-weight:800;text-shadow:0 1px 3px #000}.pills{display:flex;gap:5px;flex-wrap:wrap}.mini{pointer-events:auto;background:#09273ee9;color:#f2fcff;border:1px solid #59a2be;border-radius:9px;padding:6px 9px;font-size:11px}
.overlay{position:absolute;inset:0;z-index:4;background:linear-gradient(150deg,#021a2be9,#0b3c58c8);display:flex;align-items:center;justify-content:center;padding:9px;overflow:auto}.overlay.hide{display:none}.panel{border:1px solid #92edfc72;box-shadow:0 8px 35px #001327cf,inset 0 1px 0 #ffffff23;background:linear-gradient(145deg,#09263fef,#114c67ef);border-radius:16px;padding:clamp(11px,2vw,24px);text-align:center;width:min(620px,100%);max-height:100%;overflow:auto}.tag{font-size:10px;color:#a8ffde;font-weight:900;letter-spacing:.2em}.panel h1{margin:3px 0;font-size:clamp(20px,4vw,40px);line-height:1.05;letter-spacing:-.06em;color:#ffe38a;text-shadow:0 3px 0 #6b3d2c,0 8px 20px #0007}.panel p{margin:7px auto 10px;color:#e1f3f9;font-size:clamp(10px,1.35vw,14px);line-height:1.42;max-width:540px}.buttons{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #fff9b8;background:linear-gradient(#ffe8a0,#e5a750);color:#153047;font-weight:950;padding:10px 16px;border-radius:10px;box-shadow:0 4px 0 #834529;font-size:clamp(11px,1.4vw,16px)}.btn.alt{background:#183f56;color:#e9fcff;border-color:#629caf;box-shadow:0 4px 0 #0c2637}.btn:active{transform:translateY(3px)}
.characters{display:flex;gap:10px;justify-content:center;align-items:end;max-height:152px}.characters img{max-height:clamp(77px,17vh,143px);max-width:26%;object-fit:contain;filter:drop-shadow(0 5px 7px #001628);-webkit-user-drag:none}.footnote{font-size:11px;color:#acd4e1}.rotate-msg{display:none}
@media(orientation:portrait){#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) clamp(120px,21dvh,210px);gap:5px}.viewport{grid-row:1;grid-column:1}.side{grid-row:2;grid-column:1;display:flex;flex-direction:row;height:100%;padding:4px 8px}.side.left{justify-content:flex-start}.side.right{justify-content:flex-end;z-index:2;pointer-events:none;margin-top:calc(-1*clamp(120px,21dvh,210px))}.side.right>*{pointer-events:auto}.stick{width:min(24vw,13dvh,128px);height:min(24vw,13dvh,128px);min-width:68px;min-height:68px}.round{width:min(14vw,9dvh,64px);height:min(14vw,9dvh,64px);min-width:40px;min-height:40px}.hint{display:none}.actions{gap:5px;max-width:150px}.panel p{font-size:12px}}
@media(max-height:330px) and (orientation:landscape){#app{grid-template-columns:74px minmax(0,1fr) 114px}.stick{width:65px;height:65px}.round{width:39px;height:39px}}
</style></head>

function showMenu(){state='menu';overlay.classList.remove('hide');panel.innerHTML=`<div class="tag">V22 — FIRST PLAYABLE ART PROTOTYPE</div><h1>FISHMAN AQUARIUM</h1><p>Explore the newly illustrated Aquarium with Kai, find six formula bottles, transform Finn into Fishman, and fight Glowfang. This is a separate visual prototype; the full online game remains unchanged.</p><div class="characters"><img src="${assetUris.finn_34}" alt="Finn in red hoodie"><img src="${assetUris.fishman_swim}" alt="Fishman swimming"><img src="${assetUris.kai_34}" alt="Kai in blue inventor outfit"></div><div class="buttons"><button class="btn" id="start">▶ START AQUARIUM</button><button class="btn alt" id="gallery">CHARACTER VIEWS</button></div><p class="footnote">Move: left stick or WASD · Aim/fire: right stick or IJKL · A fire · S skill · B interact</p>`;document.getElementById('start').onclick=resetGame;document.getElementById('gallery').onclick=showGallery;}
function showGallery(){overlay.classList.remove('hide');panel.innerHTML=`<div class="tag">APPROVED COMIC-INSPIRED ARTWORK</div><h1>FINN + KAI + FISHMAN</h1><div class="characters" style="max-height:170px">${['finn_front','finn_side','fishman_side','kai_front','kai_side'].map(x=>`<img alt="${x}" title="${x}" src="${assetUris[x]}">`).join('')}</div><p>Extracted from the approved design sheet: front and side views, plus swimming and shooting poses. These are image-based animation prototypes, not rigged 3D models yet.</p><div class="buttons"><button class="btn" id="playFromGallery">▶ PLAY</button><button class="btn alt" id="back">BACK</button></div>`;document.getElementById('playFromGallery').onclick=resetGame;document.getElementById('back').onclick=showMenu;}
function finish(){state='win';overlay.classList.remove('hide');panel.innerHTML=`<div class="tag">CHAPTER 1 • PROTOTYPE CLEARED</div><h1>GLOWFANG DEFEATED!</h1><p>Finn became Fishman, Kai's formula worked, and the Aquarium is safe. Stars collected: <b>${G.stars}</b> · Weapon level <b>${G.weapon}</b>.</p><div class="buttons"><button class="btn" id="replay">REPLAY</button><button class="btn alt" id="menu">MENU</button></div>`;document.getElementById('replay').onclick=resetGame;document.getElementById('menu').onclick=showMenu;}
function lose(){G.lives--;if(G.lives<=0){state='lost';overlay.classList.remove('hide');panel.innerHTML=`<div class="tag">OUT OF LIVES</div><h1>TRY AGAIN!</h1><p>Return to the Aquarium entrance with full hearts.</p><div class="buttons"><button class="btn" id="retry">RESTART</button></div>`;document.getElementById('retry').onclick=resetGame;return;}G.hp=G.maxHp;G.inv=2.6;G.x=G.checkpoint;G.y=395;G.vx=G.vy=0;effects.push({x:G.x,y:G.y,r:15,l:1.1,color:'#f7f6aa'});say(`REVIVED! ${G.lives} lives left · full health`,2.3);sound(550,.4);}
function fire(){if(state!=='play'||paused||G.cool>0)return;let a=G.aim;if(Math.hypot(a.x,a.y)<.1)a={x:G.face,y:0};let d=Math.hypot(a.x,a.y),vx=a.x/d,vy=a.y/d;G.projectiles.push({x:G.x+vx*28,y:G.y-12+vy*15,vx:vx*720,vy:vy*720,life:1.2,r:9+G.weapon*2,damage:12+G.weapon*6,hero:G.hero});G.attack=.22;G.cool=G.hero==='fish'?.20:.28;effects.push({x:G.x+vx*37,y:G.y-12,r:10,l:.2,color:G.hero==='fish'?'#a0ffff':'#ffdb8b'});sound(G.hero==='fish'?650:450,.09,.025);}
function skill(){if(state!=='play'||G.skillCd>0)return;G.skillCd=6.2;G.inv=Math.max(G.inv,2.0);G.hp=Math.min(G.maxHp,G.hp+1);effects.push({x:G.x,y:G.y,r:10,l:1.0,color:'#9efcff',grow:200});say(G.hero==='fish'?'BUBBLE DOME!':'TIME FLASK! Enemies stunned',2);for(const e of G.enemies)if(e.alive&&Math.abs(e.x-G.x)<250)e.stun=3;}
function interact(){if(state!=='play'||paused)return;if(!G.transformed){if(G.collect<6){say(`Find ${6-G.collect} more formula bottles!`,1.4);return;}if(G.x<1990){say('Finn is near the laboratory around the next corner.',2);return;}G.transformed=true;G.hero='fish';G.hp=G.maxHp;G.checkpoint=2100;effects.push({x:G.x,y:G.y,r:30,l:1.5,color:'#80f9fb',grow:210});say('CHOMP! Finn transforms into FISHMAN — SWIM!',4);sound(784,.5);return;}if(G.boss&&G.boss.hp<=0)finish();else say('Use your bubble weapon and defeat Glowfang!',1.5);}
function mixEnemy(dt){for(const e of G.enemies){if(!e.alive)continue;e.phase+=dt*.9;e.y=e.base+Math.sin(t*1.45+e.phase)*28;e.stun=Math.max(0,(e.stun||0)-dt);if(e.x<G.cam-150||e.x>G.cam+W+160)continue;if(e.stun<=0){e.cool-=dt;if(e.cool<=0){e.cool=2.0+Math.random()*1.7;if(Math.hypot(e.x-G.x,e.y-G.y)<400){G.projectiles.push({x:e.x,y:e.y,vx:(G.x-e.x)*.7,vy:(G.y-e.y)*.7,life:2.4,r:6,damage:0,enemy:true});}}}if(G.inv<=0&&Math.hypot(e.x-G.x,e.y-G.y)<36){G.hp--;G.inv=1.3;sound(160,.25,.05,'sawtooth');if(G.hp<=0)lose();}}}
function launchBoss(){G.boss={x:4530,y:335,hp:410,maxHp:410,phase:0,attackTimer:2,projectiles:[]};G.enemies=[];G.x=4140;G.cam=4030;G.inv=2;say('BOSS ALERT! GLOWFANG — 3 PHASES',3.6);sound(130,.5,.05,'sawtooth');}
function update(dt){if(state!=='play'||paused)return;t+=dt;G.inv=Math.max(0,G.inv-dt);G.cool=Math.max(0,G.cool-dt);G.skillCd=Math.max(0,G.skillCd-dt);G.attack=Math.max(0,G.attack-dt);G.messageTime=Math.max(0,(G.messageTime||0)-dt);
 let dx=((keys.d||keys.ArrowRight)?1:0)-((keys.a||keys.ArrowLeft)?1:0)+sticks.left.x,dy=((keys.s||keys.ArrowDown)?1:0)-((keys.w||keys.ArrowUp)?1:0)+sticks.left.y;
 const mag=Math.max(1,Math.hypot(dx,dy));dx/=mag;dy/=mag;
 G.vx+=(dx*295-G.vx)*Math.min(1,dt*8);G.vy+=(dy*258-G.vy)*Math.min(1,dt*8);
 G.move=Math.min(1,Math.hypot(G.vx,G.vy)/295);G.step+=dt*G.move*(G.hero==='fish'?10:13);
 if(Math.abs(G.vx)>22)G.face=G.vx>0?1:-1;
 G.x=clamp(G.x+G.vx*dt,45,G.boss?4520:4550);G.y=clamp(G.y+G.vy*dt,165,525);
 G.cam+=(clamp(G.x-390,0,3900)-G.cam)*Math.min(1,dt*6);
 const aimX=sticks.right.x+((keys.l?1:0)-(keys.j?1:0)),aimY=sticks.right.y+((keys.k?1:0)-(keys.i?1:0)),aimM=Math.hypot(aimX,aimY);
 if(aimM>.11){G.aim={x:aimX/aimM,y:aimY/aimM};fire();}else if(hold.fire)fire();
 for(const p of G.pickups){if(p.taken||Math.abs(G.x-p.x)>50||Math.abs(G.y-p.y)>60)continue;if(p.type==='formula'&&!G.transformed){p.taken=true;G.collect++;sound(950,.11);say(`Formula collected ${G.collect}/6`,1.3);}else if(p.type==='star'){p.taken=true;G.stars++;sound(660,.12);if(G.stars%5===0){G.weapon++;G.hp=Math.min(G.hp+2,G.maxHp);say('FIVE STARS! WEAPON LEVEL '+G.weapon+' + HEALTH',2.6);}else say(`★ ${G.stars} stars`,.8);}}
 if(G.collect===6&&!G.transformed&&Math.abs(G.x-2030)<160){say('FINN IS HERE! TAP B TO TRANSFORM.',2);}
 if(G.transformed&&G.x>4000&&!G.boss)launchBoss();
 if(!G.boss)mixEnemy(dt);
 for(let j=G.projectiles.length-1;j>=0;j--){const p=G.projectiles[j];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0||p.y<110||p.y>575){G.projectiles.splice(j,1);continue;}if(p.enemy){if(G.inv<=0&&Math.hypot(p.x-G.x,p.y-G.y)<25){G.projectiles.splice(j,1);G.hp--;G.inv=1.25;if(G.hp<=0)lose();}continue;}if(G.boss){const b=G.boss;if(Math.hypot(p.x-b.x,p.y-b.y)<100){const prev=b.phase;b.hp=Math.max(0,b.hp-p.damage);let next=b.hp>b.maxHp*2/3?0:b.hp>b.maxHp/3?1:2;b.phase=Math.max(prev,next);if(b.phase!==prev){b.hp=Math.max(b.hp,b.maxHp*(2-b.phase)/3);b.attackTimer=1.1;effects.push({x:b.x,y:b.y,r:18,l:.8,color:'#ffd08e',grow:145});say(`GLOWFANG PHASE ${b.phase+1}!`,2.3);}effects.push({x:p.x,y:p.y,r:12,l:.28,color:'#ffdb86'});G.projectiles.splice(j,1);if(b.hp<=0){finish();return;}continue;}}else {for(const e of G.enemies){if(e.alive&&Math.hypot(p.x-e.x,p.y-e.y)<36){e.hp-=1;G.projectiles.splice(j,1);effects.push({x:e.x,y:e.y,r:13,l:.4,color:'#fff7a2'});if(e.hp<=0)e.alive=false;break;}}}}
 if(G.boss){let b=G.boss;b.x=4530+Math.sin(t*(.9+b.phase*.4))*95;b.y=325+Math.sin(t*(1.2+b.phase*.25))*100;b.attackTimer-=dt;if(b.attackTimer<=0){b.attackTimer=Math.max(.55,1.8-b.phase*.42);const count=3+b.phase*2;for(let i=0;i<count;i++){const angle=Math.atan2(G.y-b.y,G.x-b.x)+(i-(count-1)/2)*.22;G.projectiles.push({x:b.x-44,y:b.y,vx:Math.cos(angle)*(205+b.phase*55),vy:Math.sin(angle)*(205+b.phase*55),life:3.5,r:8,enemy:true});}effects.push({x:b.x,y:b.y,r:60,l:.4,color:'#ff8f9e',grow:140});}}
 for(let i=effects.length-1;i>=0;i--){effects[i].l-=dt;effects[i].r+=dt*(effects[i].grow||65);if(effects[i].l<=0)effects.splice(i,1);}
 const zone=Math.min(5,Math.floor(G.x/800));zoneLabel.textContent='CHAPTER 1 • '+ZONES[zone].toUpperCase();status.textContent=`♥ ${Math.max(0,G.hp)}/${G.maxHp} · LIVES ${G.lives} · ★ ${G.stars} · Lv.${G.weapon}`;
}
function background(){ctx.fillStyle='#063a64';ctx.fillRect(0,0,W,H);const b=art.aquarium_scene;if(b.complete&&b.naturalWidth){const shift=G?G.cam*.11:0;for(let i=-1;i<=2;i++)ctx.drawImage(b,i*1250-(shift%1250),35,1250,640);}const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#02306b1d');grd.addColorStop(.7,'#032d6411');grd.addColorStop(1,'#001b3bac');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);for(let i=0;i<9;i++){const x=((i*165-t*15)%1350+1350)%1350;ctx.fillStyle='#cafffb15';ctx.beginPath();ctx.moveTo(x-35,80);ctx.lineTo(x+20,555);ctx.lineTo(x+130,555);ctx.closePath();ctx.fill();}const mg=art.aquarium_midground;if(mg.complete&&mg.naturalWidth){const shift=G?G.cam*.36:0;for(let i=-1;i<=2;i++){ctx.save();ctx.globalAlpha=.28;ctx.drawImage(mg,i*1040-(shift%1040),340,1040,225);ctx.restore();}}}
function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function circle(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=col;ctx.fill();}
function text(s,x,y,size=18,col='#fff',align='center'){ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.lineWidth=4;ctx.strokeStyle='#092941';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function drawWorld(){const camera=G.cam;ctx.save();ctx.translate(-camera,0);for(let zone=0;zone<6;zone++){const bx=zone*800;ctx.save();ctx.globalAlpha=.20;ctx.fillStyle=zone%2?'#142b5e':'#2b92ad';ctx.fillRect(bx,165,800,385);ctx.restore();if(zone>0){text(ZONES[zone-1].toUpperCase(),bx+70,168,14,'#b1fff4','left');}}
 for(let x=0;x<4800;x+=205){const y=545+Math.sin(x*.015)*13;rect(x, y, 154, 22, 11,'#0d3442');rect(x+3, y-4,148,16,9,'#699d71');for(let j=0;j<5;j++)circle(x+12+j*24,y-7,rand(2,4),['#5ed9ab','#89eede','#f48bd3'][j%3]);}
 for(let i=0;i<22;i++){const x=170+i*208,y=502+(i%3)*12;ctx.strokeStyle='#a4ffcf7b';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x,y+55);ctx.quadraticCurveTo(x+Math.sin(t*1.2+i)*25,y-40,x+Math.sin(t*1.2+i)*35,y-70-(i%4)*10);ctx.stroke();}
 for(const p of G.pickups){if(p.taken||p.x<camera-60||p.x>camera+W+60)continue;const y=p.y+Math.sin(t*2+p.x*.01)*5;if(p.type==='star'){ctx.save();ctx.translate(p.x,y);ctx.rotate(t*.4);ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?10:25;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fillStyle='#ffcd50';ctx.shadowColor='#ffed69';ctx.shadowBlur=17;ctx.fill();ctx.restore();}else{rect(p.x-12,y-22,24,37,7,'#6bf2da');rect(p.x-7,y-34,14,15,4,'#d2fff7');circle(p.x,y+1,7,'#d3effe');}}
 for(const e of G.enemies){if(!e.alive||e.x<camera-120||e.x>camera+W+120)continue;const size=e.kind==='crab_bot'?90:e.kind==='sea_mine'?68:80;img(e.kind,e.x,e.y,size,size,false,Math.sin(t*2+e.phase)*.06,e.stun>0?.65:1);}
 if(!G.transformed&&G.x>1540){img('finn_34',2020,360,106,150,false,Math.sin(t*3)*.015);text('FINN',2020,255,18,'#fff2a7');if(G.collect>=6){text('TAP B TO TRANSFORM',2020,277,14,'#c5fffb');}}
 if(G.boss){const b=G.boss;ctx.save();ctx.shadowColor='#ff738a';ctx.shadowBlur=22+Math.sin(t*7)*10;img('glowfang',b.x,b.y,240+b.phase*19,220+b.phase*19,true,Math.sin(t*2)*.12);ctx.restore();}
 for(const p of G.projectiles){circle(p.x,p.y,p.r,p.enemy?'#ff8f9e':'#a8faff');circle(p.x-2,p.y-3,Math.max(2,p.r*.33),'#fff');}
 for(const e of effects){ctx.globalAlpha=Math.max(0,Math.min(1,e.l*1.2));ctx.strokeStyle=e.color;ctx.lineWidth=6;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.stroke();}ctx.globalAlpha=1;
 drawHero();ctx.restore();}
function drawHero(){const h=G.hero,moving=G.move,lean=Math.sin(G.step)*.06*moving,mirror=G.face<0;
 if(G.inv>0&&Math.sin(t*19)>0&&G.inv<1.6)ctx.globalAlpha=.62;
 if(h==='kai'){img(G.attack>0?'kai_shoot':moving>.1?'kai_side':'kai_34',G.x,G.y-10,104,126,mirror,lean);}else{img(G.attack>0||moving>.14?'fishman_swim':'fishman_side',G.x,G.y-8,138,112,mirror,lean+Math.sin(t*5)*.03);for(let i=0;i<3;i++)circle(G.x-G.face*(49+i*21)-((t*28+i*7)%25),G.y+22-i*15,3+i,'#a3f9fc7b');}
 if(G.attack>0){const a=G.aim;ctx.save();ctx.strokeStyle=h==='fish'?'#abfff4':'#ffdf91';ctx.lineWidth=7;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=17;ctx.beginPath();ctx.moveTo(G.x,G.y-12);ctx.lineTo(G.x+a.x*72,G.y-12+a.y*72);ctx.stroke();ctx.restore();}
 ctx.globalAlpha=1;
}
function drawScreen(){background();if(G){drawWorld();if(G.boss){let b=G.boss;rect(325,84,452,16,8,'#17394e');rect(330,88,442*(b.hp/b.maxHp),9,4,b.phase===2?'#ef82be':b.phase===1?'#ffd66d':'#7de6ed');text(`GLOWFANG • PHASE ${b.phase+1}`,550,76,17,'#fff4ba');}if(G.messageTime>0)text(G.message,550,132,17,'#fff1a9');}else{img('finn_34',360,330,155,255);img('fishman_swim',590,345,245,185);img('kai_34',840,330,165,255);}}
function tick(now){const dt=Math.min(.033,Math.max(0,(now-prev||16)/1000));prev=now;frame++;if(!paused)update(dt);drawScreen();requestAnimationFrame(tick);}
function initStick(which){const b=document.getElementById(which+'Stick'),knob=document.getElementById(which+'Knob'),v=sticks[which];function move(e){const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.clientX-cx,y=e.clientY-cy,m=Math.max(1,Math.hypot(x,y)),limit=r.width*.31,a=Math.min(1,m/limit),dead=.13,q=a<dead?0:(a-dead)/(1-dead);v.x=x/m*q;v.y=y/m*q;knob.style.transform=`translate(-50%,-50%) translate(${x/m*a*limit}px,${y/m*a*limit}px)`;}
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(v.id!==null)return;v.id=e.pointerId;b.classList.add('active');b.setPointerCapture(e.pointerId);move(e);});b.addEventListener('pointermove',e=>{if(v.id===e.pointerId){e.preventDefault();move(e);}});for(const k of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(k,e=>{if(e.pointerId===v.id){v.id=null;v.x=v.y=0;knob.style.transform='translate(-50%,-50%)';b.classList.remove('active');}});}
initStick('left');initStick('right');
function bindHold(id,type,fn){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);hold[type]=true;fn();});for(const n of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(n,()=>{hold[type]=false;});}
bindHold('fireBtn','fire',fire);document.getElementById('skillBtn').addEventListener('click',skill);document.getElementById('useBtn').addEventListener('click',interact);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' ')fire();if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='q')skill();if(e.key.toLowerCase()==='p'){paused=!paused;}});window.addEventListener('keyup',e=>{keys[e.key]=false;});window.addEventListener('blur',()=>{for(const k of Object.keys(keys))keys[k]=false;hold.fire=false;});
document.getElementById('musicBtn').addEventListener('click',e=>{audio=!audio;e.currentTarget.textContent=audio?'♫ ON':'♫ OFF';if(audio){sound(523,.2);startMusic();}else if(musicTimer){clearInterval(musicTimer);musicTimer=null;}});
C.addEventListener('pointerdown',e=>{if(!G||state!=='play')return;const r=C.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H),offX=(r.width-scale*W)/2,offY=(r.height-scale*H)/2,x=(e.clientX-r.left-offX)/scale,y=(e.clientY-r.top-offY)/scale;const dx=x+G.cam-G.x,dy=y-G.y,d=Math.hypot(dx,dy);if(d>10){G.aim={x:dx/d,y:dy/d};fire();}});
showMenu();requestAnimationFrame(tick);
</script></body></html>
