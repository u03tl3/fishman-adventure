name: Fishman 4P browser QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'weapon-effects-v31.js'
      - 'city-mission-v32.js'
      - 'encounters-v32.js'
      - 'adventure-v33.js'
      - 'tests/**'
      - 'v16-4p/**'
      - 'tests/fishman-qa.mjs'
      - 'tests/fishman-webkit.mjs'
      - 'tests/fishman-master-qa.mjs'
      - '.github/workflows/fishman-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'v16-4p/**'
      - 'adventure-v33.js'
      - 'tests/**'
      - '.github/workflows/fishman-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-player-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve Fishman locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/fishman-web.log 2>&1 &
          echo $! > /tmp/fishman-server.pid
          sleep 2
      - name: Test playable v33 objectives, weapon targets, rescue missions, stealth and transitions
        run: node tests/fishman-adventure-v33.mjs
      - name: Test multiplayer and visual layouts
        run: node tests/fishman-qa.mjs
      - name: Test Safari-style WebKit touch interactions
        run: node tests/fishman-webkit.mjs
      - name: Test master artwork, ten chapters, land/water and two-player sync
        run: node tests/fishman-master-qa.mjs
      - name: Test six unique weapon mechanics, upgrades and Chromium/WebKit effects
        run: node tests/fishman-weapon-v31.mjs
      - name: Test v32 city missions and story encounter logic
        run: |
          node tests/fishman-city-v32.mjs
          node tests/fishman-encounters-v32.mjs
