name: Fishman 4P browser QA
on:
  push:
    branches: [main]
    paths:
      - 'v16-4p/**'
      - 'tests/fishman-qa.mjs'
      - '.github/workflows/fishman-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-player-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve Fishman locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/fishman-web.log 2>&1 &
          echo $! > /tmp/fishman-server.pid
          sleep 2
      - name: Test multiplayer and visual layouts
        run: node tests/fishman-qa.mjs
