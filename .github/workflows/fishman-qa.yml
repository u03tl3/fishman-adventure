name: Fishman main game and 4P browser QA
on:
  push:
    branches: [main, 'feature/v30-art-motion-coop-sync']
    paths:
      - 'index.html'
      - 'v16-4p/**'
      - 'tests/fishman-qa.mjs'
      - 'tests/fishman-webkit.mjs'
      - 'tests/fishman-v30-qa.mjs'
      - '.github/workflows/fishman-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-game-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve game locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/fishman-web.log 2>&1 &
          sleep 2
      - name: Test ten chapters, approved art, Aqua Hover Pod and two-player synchronisation
        run: node tests/fishman-v30-qa.mjs
  four-player-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve Fishman locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/fishman-web.log 2>&1 &
          echo $! > /tmp/fishman-server.pid
          sleep 2
      - name: Test multiplayer and visual layouts
        run: node tests/fishman-qa.mjs
      - name: Test Safari-style WebKit touch interactions
        run: node tests/fishman-webkit.mjs
